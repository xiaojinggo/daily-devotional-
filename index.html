<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日職場靈修</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{--bg:#EEF2F5;--card:#fff;--text:#1B2B38;--sub:#5A6B78;--head:#1F3A4D;--hs:#C9D6DF;--ac:#E3B866;--btn:#1F3A4D;--bt:#fff;--ok:#2F7A55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#182731;--text:#E8EEF2;--sub:#9FB0BC;--head:#162B3A;--hs:#9FB0BC;--btn:#E3B866;--bt:#1B2B38;--ok:#6CCB98;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#182731;--text:#E8EEF2;--sub:#9FB0BC;--head:#162B3A;--hs:#9FB0BC;--btn:#E3B866;--bt:#1B2B38;--ok:#6CCB98;color-scheme:dark}
html{background:var(--head)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh}
.w{max-width:480px;margin:0 auto}
header{background:var(--head);color:#fff;padding:28px 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center}
.nm{font-size:13px;letter-spacing:2px;color:var(--hs)}
.sl{font-family:'Noto Serif TC',serif;font-size:15px;color:var(--ac);margin:4px 0 16px}
.dr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dr button{width:44px;height:44px;border:1px solid var(--hs);border-radius:22px;background:none;color:#fff;font-size:22px;cursor:pointer}
#date{font-size:26px;font-weight:700;text-align:center}
#wk{font-size:15px;color:var(--ac);text-align:center;margin-top:2px}
.ch{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin-top:14px;font-size:12px;color:var(--hs)}
.sk{text-align:center;margin-top:14px;font-size:14px;font-weight:700;color:var(--ac)}
#today{display:block;margin:12px auto 0;background:none;border:0;color:var(--ac);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;min-height:44px}
main{padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
.c{background:var(--card);border-radius:16px;padding:22px}
h2{margin:0 0 10px;font-size:13px;letter-spacing:2px;color:var(--sub)}
#verse{font-family:'Noto Serif TC',serif;font-size:21px;line-height:1.7;font-weight:500;margin:0}
#ref{margin:10px 0 0;font-size:14px;color:var(--sub)}
.t{font-size:16px;line-height:1.9;margin:0}
ol{margin:0;padding:0;list-style:none;counter-reset:q;display:flex;flex-direction:column;gap:12px}
li{counter-increment:q;display:flex;gap:12px;font-size:16px;line-height:1.8}
li::before{content:counter(q);flex:none;width:26px;height:26px;border-radius:13px;background:var(--btn);color:var(--bt);font-size:13px;text-align:center;line-height:26px}
#done{min-height:52px;border:0;border-radius:26px;background:var(--btn);color:var(--bt);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
#done.on{background:none;border:2px solid var(--ok);color:var(--ok)}
.f{text-align:center;font-size:12px;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
<div class="w">
<header>
<div class="top"><span class="nm">每日職場靈修</span></div>
<div class="sl">職場日常，因主而不同</div>
<div class="dr">
<button id="prev" aria-label="前一天">‹</button>
<div><div id="date"></div><div id="wk"></div></div>
<button id="next" aria-label="後一天">›</button>
</div>
<button id="today" hidden>回到今天</button>
<div class="ch"><span>讀經 1 分</span><span>·</span><span>默想 3 分</span><span>·</span><span>鼓勵 1 分</span><span>·</span><span>禱告 2 分</span></div>
<div class="sk" id="streak"></div>
</header>
<main>
<section class="c"><h2>今日經文</h2><p id="verse"></p><p id="ref"></p></section>
<section class="c"><h2>默想方向</h2><ol id="med"></ol></section>
<section class="c"><h2>鼓勵的話</h2><p class="t" id="enc"></p></section>
<section class="c"><h2>禱告</h2><p class="t" id="pray"></p></section>
<button id="done" aria-pressed="false">完成今日靈修</button>
<div class="f">所有內容皆取自聖經（和合本）<br>目前為 30 天輪替的示範內容</div>
</main>
</div>
<script>
const D=[
{r:"歌羅西書 3:23",v:"無論作甚麼，都要從心裡作，像是給主作的，不是給人作的。",p:"天父，感謝祢差遣祢的兒子耶穌基督，替我死在十字架上，使我的罪得赦免，也使我成為祢的兒女。我今天的工作，不是為了賺取祢的喜悅，因為祢已經在基督裡接納了我。求祢幫助我誠實、準時、盡心做事，也用善意對待同事，好叫人從我身上看見祢的恩典。奉主耶穌的名禱告，阿們。",e:"你在神面前的價值，不是由業績或誰的稱讚決定，而是因為基督已經為你死。你不是為了得救而工作，而是因為已經蒙恩，才為主盡心。沒有人看見的認真，主都看見。（參以弗所書 2:8-9）",m:["今天哪一件工作我最容易敷衍？想到耶穌為我付上的代價，我會怎麼做？","我是不是常想靠表現換取別人（或神）的接納？基督已經成就的救恩怎樣安慰我？","今天我可以對哪位同事做一件具體的善意小事，讓他感受到基督的愛？"]},
{r:"馬太福音 11:28",v:"凡勞苦擔重擔的人，可以到我這裡來，我就使你們得安息。",p:"主耶穌，我今天很累，心裡也很亂。謝謝祢為我的罪死在十字架上，使我可以坦然來到神面前，不必再自己拚命證明什麼。我把今天的重擔帶到祢面前：（停下來，把它說出來）。求祢使我的心安靜，也教我分辨哪些是我該做的，哪些要交給祢。奉祢的名，阿們。",e:"主邀請的是勞苦擔重擔的人，沒有要你先整理好才能來。祂為你死而復活，使你與神和好，也使你的心有安息（參羅馬書 5:1）。累了，不代表你不夠屬靈；先來到祂面前。",m:["現在壓在我身上最重的一件事是什麼？用一句話向主說出來。","我是靠自己的努力硬撐，還是真的把重擔交給主？","今天哪個時間可以留一分鐘，單單感謝耶穌為我所成就的？"]},
{r:"以賽亞書 40:31",v:"但那等候耶和華的，必從新得力。他們必如鷹展翅上騰；奔跑卻不困倦，行走卻不疲乏。",p:"全能的神，我很疲乏，有時連禱告的力氣都不多。謝謝祢沒有因我軟弱而丟棄我，反而差遣耶穌基督為我受死、復活，賜我永遠的盼望。求祢憐憫我，教我學習等候祢，在祢裡面重新得力，一步一步走完今天。奉主耶穌的名禱告，阿們。",e:"聖經裡的「等候」，是帶著盼望倚靠主。我們的力量會耗盡，但基督已經復活，這是永不枯竭的盼望。慢一點、停一停，不是失敗。",m:["我的疲乏主要來自身體、情緒，還是心靈的乾渴？","想到耶穌已經從死裡復活，我對今天的疲憊有什麼不同的看法？","今天我可以放下或減少哪一件事，讓自己好好喘口氣？"]},
{r:"腓立比書 4:13",v:"我靠著那加給我力量的，凡事都能作。",p:"天父，我承認自己有限，也常想靠表現證明自己。謝謝祢，我的義和價值不在我的成績，而在耶穌基督為我成就的救恩。求祢加給我力量與智慧，無論順境逆境，都學會知足，不被成敗左右。奉耶穌基督的名禱告，阿們。",e:"保羅寫下這節經文時，正處在困境中，他學到的是不論豐富或缺乏，都有基督的力量。這不是保證事事成功，而是不論順逆，你都在基督裡，不是一個人。（參腓立比書 3:9；4:11-12）",m:["今天哪件事讓我覺得自己不夠好？","我是不是把「做得到」和「我的價值」連在一起？福音怎樣更正這一點？","我願意向哪位同事或弟兄姐妹求助一次嗎？"]},
{r:"彼得前書 5:7",v:"你們要將一切的憂慮卸給神，因為他顧念你們。",p:"親愛的天父，我擔心工作的未來，也擔心家人的需要。謝謝祢連自己的兒子都不愛惜，為我們眾人捨了（羅馬書 8:32），我就相信祢也顧念我今天的需要。我把擔心一件一件交給祢：（停下來說出來）。求祢賜我平靜的心，做好我能做的，其餘的放在祢手中。奉主耶穌的名禱告，阿們。",e:"「卸給」是把重量放下，不是在心裡一直抱著。神已經把最寶貴的給了我們，就是祂的兒子耶穌，祂也必顧念你工作、家計、前途的需要。",m:["我最近在半夜或通勤時，最常想的擔憂是什麼？","想到神為我捨了祂的兒子，我對「祂不顧念我」的想法需要怎樣調整？","分成「我能做的」和「我無法控制的」，今天先做哪一小步？"]},
{r:"約書亞記 1:9",v:"我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華你的神必與你同在。",p:"耶和華我的神，今天我要面對一場困難的對話（或決定），心裡很害怕。謝謝祢，耶穌復活後應許祂常與我們同在，直到世界的末了（馬太福音 28:20）。求祢使我剛強壯膽，不靠脾氣或強勢，而靠祢的同在，賜我誠實又溫和的話語。奉主耶穌的名禱告，阿們。",e:"這句應許是神對約書亞說的；今天我們因著基督復活的應許，確信祂與我們同在。在會議室、在談判桌、在那句難開口的話旁邊，祂都在。",m:["今天哪件事我知道該做對，卻很掙扎？","想到復活的主與我同在，我的恐懼有什麼不同？","我可以怎樣「誠實又溫和」地說出該說的話？"]},
{r:"哥林多前書 15:58",v:"所以，我親愛的弟兄們，你們要堅固，不可搖動，常常竭力多做主工，因為知道你們的勞苦在主裡面不是徒然的。",p:"主啊，有時我很努力，卻沒有看見成果，也沒有人看見。謝謝祢，耶穌基督為我們的罪死了，埋葬了，第三天又復活了（哥林多前書 15:3-4），所以我在主裡的勞苦不是徒然。求祢使我堅固、不搖動，把成果和評價交在祢手中。奉主耶穌基督的名禱告，阿們。",e:"這節經文的前面，是福音的核心：基督為我們的罪死，又復活。因為祂復活，我們在主裡的勞苦不會白費。成果也許不會馬上看見，但主都記得。",m:["哪件努力讓我覺得沒有被看見？","我是否需要先看到成果，才肯相信這件事有意義？","今天我可以怎樣在原來的位置上，為復活的主繼續盡心？"]}
,
{r:"箴言 3:5-6",v:"你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定他，他必指引你的路。",p:"天父，我常倚靠自己的聰明。謝謝祢差耶穌為我死，使我能親近祢。求祢在今天的決定上指引我，使我專心仰賴祢。奉主耶穌的名禱告，阿們。",e:"面對選擇，先到主面前，再運用你的專業和經驗。那位為你預備救恩的主，必不離棄你的路。",m:["今天哪個決定我最想自己拿主意？","我可以先向主禱告，再向誰請教？","回想過去，主曾怎樣指引我？"]},
{r:"雅各書 1:5",v:"你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他。",p:"主啊，我在工作上缺少智慧，不知該怎麼做。謝謝祢因基督白白賜下恩典，我也相信祢樂意賜智慧給我。求祢賜我辨別和分寸。奉耶穌的名，阿們。",e:"求智慧不丟臉。那位白白賜下兒子的神，也樂意賜智慧給你，不會責備你。",m:["我現在最缺乏哪方面的智慧？","我是否怕被看輕，而不敢求助？","今天我可以向主求哪件具體的事？"]},
{r:"詩篇 23:1",v:"耶和華是我的牧者，我必不至缺乏。",p:"耶和華我的牧者，謝謝祢為羊捨命，也供應我一切需要。求祢使我不被薪水、職位和比較綑綁，學習知足。奉主耶穌的名禱告，阿們。",e:"耶穌是好牧人，為羊捨命（約翰福音 10:11）。肯為你捨命的牧者，也必顧念你的需要。",m:["我最常拿什麼和別人比較？","哪一項供應我已經擁有，卻忘了感謝？","今天可以為哪件事向主獻上感謝？"]},
{r:"以弗所書 4:32",v:"並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。",p:"天父，有同事的言行讓我很生氣。謝謝祢在基督裡饒恕了我。求祢幫助我不懷怨，用恩慈與憐憫對待他。奉耶穌基督的名禱告，阿們。",e:"我們能饒恕，是因為先被饒恕。這不代表不分是非，而是不讓苦毒綁住自己。",m:["誰的言行讓我最難釋懷？","主饒恕我的有多少？這怎樣影響我的心？","今天我可以邁出哪一小步？例如禱告或一句善意的話。"]},
{r:"馬太福音 6:33",v:"你們要先求他的國和他的義，這些東西都要加給你們了。",p:"主啊，我常把工作和成就放在第一位。謝謝祢先愛了我，為我捨命。求祢使我先尋求祢的國和義，把一切需要交託給祢。奉主耶穌的名禱告，阿們。",e:"優先順序對了，心就安定。神的國不是靠我們賺取，而是祂在基督裡白白賜給我們的。",m:["我現在的生活，什麼排在第一位？","今天我可以怎樣把「神的義」放進決定裡？","我需要調整哪一項時間安排？"]},
{r:"詩篇 46:1",v:"神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。",p:"神啊，祢是我的避難所。公司的變動讓我不安，我把這些交給祢。謝謝祢在基督裡成為我永遠的倚靠。奉主耶穌的名禱告，阿們。",e:"環境會變，但神不變。祂在基督裡成為你的避難所，患難中隨時幫助你。",m:["工作上有什麼變動讓我不安？","我的安全感主要放在哪裡？","今天我願意向主說出心裡的害怕。"]},
{r:"羅馬書 8:28",v:"我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。",p:"天父，有些事我看不明白，也很難說是好事。謝謝祢，連十字架也成了救恩。求祢使我相信，祢掌管我的工作和前途。奉主耶穌的名禱告，阿們。",e:"這節經文不是說每件事本身都是好事，而是神能在一切裡成就益處。十字架就是最大的證明。",m:["目前哪件事讓我最難接受？","我願意把它交在神的手中，等候祂的帶領嗎？","過去有沒有一件難事，後來讓我看見神的益處？"]},
{r:"馬太福音 5:16",v:"你們的光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。",p:"天父，謝謝祢在基督裡呼召我，使我成為世上的光。求祢使我在職場的言行，讓人看見好行為而榮耀祢，不是彰顯自己。奉耶穌的名禱告，阿們。",e:"光不需要喧嚷，只要在黑暗中發亮。你的誠實和善待，就是見證。",m:["同事會從我身上看見什麼？","今天哪件事我能做得誠實又良善？","我有沒有為某位同事禱告過？"]},
{r:"箴言 15:1",v:"回答柔和，使怒消退；言語暴戾，觸動怒氣。",p:"主耶穌，祢被辱罵不還口。求祢幫助我在衝突中言語柔和，不被情緒牽著走。謝謝祢為我受苦，也赦免我的急躁。奉祢的名，阿們。",e:"柔和不是軟弱。耶穌被罵不還口（彼得前書 2:23），祂能幫助你在壓力下管住舌頭。",m:["最近我在什麼情況下說話最衝？","如果換成柔和的回答，我會怎麼說？","今天回應之前，我可以先停三秒禱告嗎？"]},
{r:"羅馬書 12:18",v:"若是可行，總要盡力與眾人和睦。",p:"天父，有些關係我已盡力，仍然很緊張。謝謝祢藉著基督使我與祢和好，也求祢賜我智慧與人和睦。奉主耶穌的名禱告，阿們。",e:"經文說「若是可行」，也說「盡力」。你負責你的一份，結果交給主。基督已使我們與神和好，我們也能成為和睦的人。",m:["哪一段關係最讓我緊繃？","我已盡的一份是什麼？還能做什麼？","哪些部分我必須放手交給主？"]},
{r:"約翰福音 14:27",v:"我留下平安給你們，我將我的平安賜給你們。我所賜的，不像世人所賜的。你們心裡不要憂愁，也不要膽怯。",p:"主耶穌，祢留下平安給我。我的心今天很亂，求祢賜我祢的平安，不是世界給的那種。謝謝祢以十字架使我與神和好。奉祢的名，阿們。",e:"耶穌賜的平安，不像世人所賜的。這平安來自與神和好，不是環境順利。",m:["此刻是什麼在奪走我的平安？","世界給的平安和主給的平安有什麼不同？","今天我可以用哪一句經文提醒自己？"]},
{r:"詩篇 121:1-2",v:"我要向山舉目；我的幫助從何而來？我的幫助從造天地的耶和華而來。",p:"造天地的主，我的幫助從祢而來。謝謝祢在基督裡成為我隨時的幫助。今天無論遇到什麼，求祢保守我。奉主耶穌的名禱告，阿們。",e:"你的幫助不只是同事、主管或自己，而是造天地的主。祂更為你差遣了耶穌。",m:["我習慣向誰求幫助？","向主求助對我來說容易嗎？","今天遇到困難時，我先向主舉目禱告。"]},
{r:"哥林多後書 12:9",v:"我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。",p:"主啊，我的軟弱讓我很挫折。謝謝祢的恩典夠我用，祢也在十字架上顯出軟弱中的大能。求祢使我不再隱藏軟弱。奉耶穌基督的名禱告，阿們。",e:"保羅求主挪去軟弱，主卻回答他恩典夠用。軟弱的地方，正是主的能力顯出來的地方。（參哥林多後書 12:7-9）",m:["我最不想被人看見的軟弱是什麼？","我願意向主誠實說出來嗎？","今天我可以怎樣倚靠恩典，而不是逞強？"]},
{r:"約翰福音 3:16",v:"神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不至滅亡，反得永生。",p:"天父，謝謝祢愛世人，賜下獨生子耶穌。我今天上班，也是活在祢的愛裡。求祢使我常記得救恩，也讓我身邊的人認識祢。奉主耶穌的名禱告，阿們。",e:"這是福音的核心：神愛我們，賜下耶穌，使信的人得永生。你的工作、你的人，都被這份愛包圍。",m:["我是否真的相信神愛我？","有沒有哪位同事，我願意為他禱告，求主讓他認識耶穌？","今天我可以怎樣把這份愛活出來？"]}
,
{r:"馬可福音 6:31",v:"你們來，同我暗暗的到曠野地方去歇一歇。",p:"主耶穌，謝謝祢邀請我歇一歇。我常覺得不能停，怕事情做不完。求祢使我相信，休息也是順服。謝謝祢已經成就救恩，我不必靠不停工作證明自己。奉祢的名，阿們。",e:"忙碌中，耶穌親自邀請門徒歇一歇。休息不是偷懶，是承認我們不是神。",m:["我最近有真正休息嗎？","我怕停下來的原因是什麼？","今天我可以安排哪一小段時間，單單與主同在？"]},
{r:"帖撒羅尼迦前書 5:16-18",v:"要常常喜樂，不住的禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。",p:"天父，我常常只看見工作裡缺少的東西。謝謝祢在基督耶穌裡賜給我的一切，包括救恩、工作、同事和今天的呼吸。求祢使我學會凡事謝恩。奉主耶穌的名禱告，阿們。",e:"感恩不是假裝一切都好，而是知道神在基督裡已經給了最好的。從今天的一件小事開始就好。",m:["今天有哪三件事我可以感謝？","我最容易抱怨的是什麼？","我願意向誰說一句感謝的話？"]},
{r:"提摩太前書 2:1-2",v:"第一要為萬人懇求、禱告、代求、祈謝；為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事的度日。",p:"天父，我為我的主管和公司的領導者禱告。求祢賜他們智慧和公義，也幫助我誠心尊重他們。謝謝祢，也願我們都認識耶穌基督。奉主耶穌的名禱告，阿們。",e:"為在位的人禱告，是聖經的教導。即使有難處，禱告能改變我們看待他人的心。",m:["我的主管現在需要什麼？","我能為他說出哪一句真心的禱告？","我對在位者的態度，有需要被主更新的地方嗎？"]},
{r:"路加福音 16:10",v:"人在最小的事上忠心，在大事上也忠心；在最小的事上不義，在大事上也不義。",p:"天父，求祢幫助我在小事上忠心：準時、誠實、不佔便宜、不說謊。謝謝祢在基督裡赦免我過去的虧欠，也賜我力量走正直的路。奉耶穌的名禱告，阿們。",e:"沒有人檢查的小地方，最能顯出品格。我們不是靠自己做到完美，而是靠主的恩典一步步改變。",m:["今天哪件小事最容易讓我鬆懈？","我有沒有任何需要誠實面對的事？","我願意在哪一件事上，做得比別人期待的更正直？"]},
{r:"希伯來書 4:16",v:"所以，我們只管坦然無懼的來到施恩的寶座前，為要得憐恤，蒙恩惠，作隨時的幫助。",p:"主耶穌，我覺得自己不夠好，也有點不敢來到祢面前。謝謝祢是我們的大祭司，能體恤我的軟弱。我現在坦然來到祢的施恩寶座前，求祢憐恤、幫助我。奉祢的名，阿們。",e:"因著耶穌，我們可以坦然來到神面前，不需要先把自己修整好。祂在那裡等著施恩。",m:["我什麼時候最覺得自己不配？","我可以怎樣把這份感覺原原本本告訴主？","今天我需要向主求什麼憐恤與幫助？"]},
{r:"約翰一書 1:9",v:"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",p:"天父，我在工作上做錯了一件事（停下來，向主說出來）。我承認，求祢赦免。謝謝耶穌的寶血，已經洗淨我。求祢賜我勇氣，去面對並彌補。奉主耶穌的名禱告，阿們。",e:"犯錯不是終點。向神認罪，祂必赦免；向人承認，也是學習的開始。福音讓我們可以誠實面對失敗。",m:["有哪件事我一直不願承認？","我需要向誰說對不起或補救？","想到主的赦免，我今天的心情有什麼不同？"]},
{r:"羅馬書 15:13",v:"但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的大能，充充足足的有盼望。",p:"盼望的神，我有時對未來很悲觀。謝謝祢，因著耶穌的復活，我有永遠的盼望。求祢用喜樂與平安充滿我的心，使我在工作中也有盼望。奉主耶穌的名禱告，阿們。",e:"盼望的根基不是景氣，也不是計畫，而是基督已經復活。這盼望不會落空。",m:["我對未來最擔心的是什麼？","基督的復活怎樣改變我看這件事的角度？","今天我可以向誰分享這份盼望？"]},
{r:"詩篇 90:12",v:"求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。",p:"天父，我的日子有限。求祢教我分辨哪些事重要，使我不把生命都花在不重要的事上。謝謝祢在基督裡賜我永生的盼望，也使今天的每一天都有意義。奉主耶穌的名禱告，阿們。",e:"數算日子，是為了把生命用在最有價值的地方。永恆的盼望，使今天的選擇更清楚。",m:["我最近的時間主要花在哪裡？","哪一件事是我該更用心的？","有什麼我該放下，好把時間留給家人與主？"]},
{r:"腓立比書 1:6",v:"那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。",p:"天父，謝謝祢在我心裡動了善工，使我認識耶穌。我走得不完美，也常常跌倒，求祢繼續塑造我，使我在工作與生活中更像基督。奉主耶穌的名禱告，阿們。",e:"救我們的那位，也必帶領我們走完全程。你不是靠自己完成，主必成全祂的工。",m:["這 30 天，我看見主在我心裡做了什麼？","還有哪一方面，我願意讓主繼續改變？","我可以邀請哪位弟兄姐妹，一起同行下去？"]}
];
const W="日一二三四五六",$=id=>document.getElementById(id);
let off=0;
function pad(n){return String(n).padStart(2,"0")}
function isDone(d){try{return localStorage.getItem("done:"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()))==="1"}catch(e){return false}}
function streakText(){const d=new Date();let n=0;if(!isDone(d))d.setDate(d.getDate()-1);while(n<1000&&isDone(d)){n++;d.setDate(d.getDate()-1)}return n>0?"連續 "+n+" 天靈修":"完成今日靈修，開始累積連續天數"}
function render(){
const d=new Date();d.setDate(d.getDate()+off);
const key=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const x=D[((n%D.length)+D.length)%D.length];
$("date").textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
$("wk").textContent="星期"+W[d.getDay()]+(off===0?" · 今天":"");
$("ref").textContent=x.r+"（和合本）";
$("verse").textContent=x.v;
$("pray").textContent=x.p;
$("enc").textContent=x.e;
$("med").textContent="";
x.m.forEach(q=>{const li=document.createElement("li");li.textContent=q;$("med").appendChild(li)});
$("today").hidden=off===0;
let done=false;
try{done=localStorage.getItem("done:"+key)==="1"}catch(e){}
const b=$("done");
b.textContent=done?"已完成今日靈修 ✓":"完成今日靈修";
b.setAttribute("aria-pressed",done);
b.classList.toggle("on",done);
$("streak").textContent=streakText();
b.onclick=()=>{try{localStorage.setItem("done:"+key,done?"0":"1")}catch(e){}render()};
}
$("prev").onclick=()=>{off--;render()};
$("next").onclick=()=>{off++;render()};
$("today").onclick=()=>{off=0;render()};
render();
</script>
